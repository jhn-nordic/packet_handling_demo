# Fly.io config. scripts/fly-deploy.sh passes --app $FLY_APP, so the app
# name below is only a placeholder for running `fly` commands by hand.
app = "smartparcel-demo"
primary_region = "arn"

[build]

[env]
  RAW_RETENTION_DAYS = "7"

# PocketBase stores everything in SQLite — keep it on a persistent volume.
# A volume belongs to one machine, so run exactly one machine (deploy with --ha=false).
[mounts]
  source = "pb_data"
  destination = "/pb/pb_data"

[http_service]
  internal_port = 8090
  force_https = true
  # Keep one machine running: the dashboard holds a realtime (SSE) connection
  # and webhooks should never wait for a cold start during a live demo.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
